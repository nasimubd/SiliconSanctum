[package]
name = "sanctum-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
libc = "0.2.176"
thiserror = "2.0.16"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4.3"
objc2 = "0.6"
objc2-metal = "0.3"

[dev-dependencies]
tempfile = "3.23.0"
proptest = "1.8.0"
