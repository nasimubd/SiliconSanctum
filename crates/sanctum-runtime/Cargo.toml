[package]
name = "sanctum-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
tokio = { version = "1.47", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.23"
