name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target "${{ matrix.target }}" -p sanctum-runtime --bin sanctum
      - name: Package
        env:
          VERSION: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${VERSION#v}"
          staging="silicon-sanctum-${version}-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/sanctum" "$staging/sanctum"
          tar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.sha256"
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" silicon-sanctum-*.tar.gz silicon-sanctum-*.sha256
