name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation runtime
        run: sudo apt-get update && sudo apt-get install --yes zsh jq
      - name: Scan tracked files and refs
        run: ./scripts/security-scan.sh
      - name: Validate configuration
        run: make validate
